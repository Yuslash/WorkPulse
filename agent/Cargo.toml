[workspace]
resolver = "2"
members = ["crates/wp-core", "crates/wp-win", "crates/wp-agent", "crates/wp-tray"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "Proprietary"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

# rustls rather than native-tls: no OpenSSL and no C toolchain dependency,
# which matters because this project builds on the windows-gnu target.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "charset",
    "http2",
] }

# Pure-Rust embedded store for the offline queue. sqlite would need cgo/C.
redb = "2.2"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

windows-sys = "0.59"
windows-service = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
